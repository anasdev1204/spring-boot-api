spring:
  application:
    name: footknow-api

  lifecycle:
    timeout-per-shutdown-phase: 20s

  jackson:
    deserialization:
      fail-on-unknown-properties: true

  mvc:
    problemdetails:
      enabled: false

  profiles:
    default: in-memory

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.footknow.football: INFO

security:
  clerk:
    issuer: ${CLERK_ISSUER}
    authorized-parties: ${CLERK_AUTHORIZED_PARTIES}
    audience: ${CLERK_AUDIENCE:}

app:
  rate-limit:
    default-tier: BASIC

    max-keys: 10000

    user-tiers: {}

    policies:
      BASIC:
        READ:
          requests: 120
          window: 1m
        WRITE:
          requests: 30
          window: 1m

      PREMIUM:
        READ:
          requests: 600
          window: 1m
        WRITE:
          requests: 120
          window: 1m